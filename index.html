(function(){

function b64(s){var r=atob(s),u=new Uint8Array(r.length);for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u;}

  var pass=decodeURIComponent(location.hash.slice(5));
  history.replaceState(null,"",location.pathname+location.search);
  document.getElementById("p").value=pass;
  var sub=function(){document.getElementById("f").requestSubmit();};
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",sub);else sub();
}
// One click: open the sign-in as a popup, which posts the passphrase back here and
// closes. If the browser blocks the popup, the link opens in this tab instead and
// the reader comes back through "#nwl=" above.
var sso=document.querySelector("a.sso");
if(sso){
  var popup=null;
  sso.addEventListener("click",function(ev){
    popup=window.open(sso.href,"nwl-sso","popup,width=480,height=640");
    if(popup)ev.preventDefault();
  });
  window.addEventListener("message",function(ev){
    if(!/^https:\/\/n-[a-z0-9-]+-script\.googleusercontent\.com$/.test(ev.origin))return;
    if(!ev.data||typeof ev.data.nwl!=="string")return;
    // Google's sandbox stops the popup closing itself; the page that opened it can.
    try{if(popup)popup.close();}catch(e){}
    document.getElementById("p").value=ev.data.nwl;
    document.getElementById("f").requestSubmit();
  });
}
})();
</script>
</body>
</html>
